name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Greet new contributors
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isIssue = !!context.payload.issue;
            const number = isIssue ? context.issue.number : context.payload.pull_request.number;
            const author = isIssue ? context.payload.issue.user.login : context.payload.pull_request.user.login;

            // Check if this is the user's first issue/PR
            const endpoint = isIssue ? 'issues' : 'pulls';
            const { data: items } = await github.rest[endpoint === 'issues' ? 'issues' : 'pulls'].listForRepo({
              owner,
              repo,
              creator: author,
              state: 'all',
              per_page: 2
            });

            // Only greet if this is their first contribution
            if (items.length > 1) return;

            const message = isIssue
              ? 'Thanks for opening your first issue here! Be sure to follow the relevant issue templates, or risk having this issue marked as invalid.'
              : `Thanks for opening this pull request! Be sure to follow the [pull request template](https://github.com/${owner}/${repo}/blob/main/.github/PULL_REQUEST_TEMPLATE.md)!`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: message
            });

name: Issue & PR Tracker

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]
  pull_request_target:
    types: [opened, reopened, labeled, unlabeled, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-management:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label and manage issues/PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isIssue = !!context.payload.issue;
            const item = context.payload.issue || context.payload.pull_request;
            const number = item.number;
            const action = context.payload.action;

            // Auto-label closed issues/PRs
            if (action === 'closed') {
              const label = isIssue
                ? (item.state_reason === 'not_planned' ? 'wontfix' : 'completed')
                : (item.merged ? 'merged' : 'closed');
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [label] });
              } catch (e) {
                core.info(`Could not add label '${label}': ${e.message}`);
              }
            }
